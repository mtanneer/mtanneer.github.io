name: Sync projects config

on:
  schedule:
    - cron: "0 8 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run projects:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PINNED_REPOS_TOKEN }}
      - run: |
          if ! git diff --quiet -- src/data/projects.config.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/projects.config.yaml
            git commit -m "chore: sync new public repos into projects config"
            git push
          fi
