# Auto = GitHub repos, pulled live at build time via REST.
# A repo must be listed here with include: true to appear at all.
# New repos are appended here automatically (include: false) by
# scripts/sync-projects-config.mjs — flip to true to publish.
#
# Manual = src/content/projects/*.md entries.
# Inclusion is governed by each file's own frontmatter (status: draft hides it).
# Config's only job here is pin state + order.
auto:
  - repo: mtanneer.github.io
    include: true
  - repo: frameworks.ml.neural-odes
    include: true
  - repo: frameworks.sv.svdoc
    include: true
  - repo: homebrew-tools
    include: false
  - repo: tools.extensions.vscode.fusesoc
    include: true
  - repo: tools.git.git-branch-manager
    include: true
  - repo: tools.macos.mac-power-monitor
    include: true
  - repo: Wordle-Clone
    include: true
  - repo: claude-session-db
    include: false
  - repo: sediment
    include: false
manual:
  - id: portfolio-webpage
    include: false
    order: 0
  - id: riscv-core
    include: false
  - id: wordle-clone
    include: false
